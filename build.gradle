plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0, 6.2)'
    
}

version = '1.0.0-SNAPSHOT'
group = 'xiuxian'

base {
    archivesName = 'xiuxian'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        gameTestServer {
            workingDirectory project.file('run/luoxia-gametest')
            property 'forge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces')
                    .getOrElse(gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'luoxiaVerify' }
                            ? 'xiuxian_geometry' : 'forge,xiuxian,xiuxian_startup')
            property 'xiuxian.verificationRoot', projectDir.absolutePath
            args '--world', 'world-' + System.currentTimeMillis()
            mods {
                "xiuxian" {
                    source sourceSets.main
                    source sourceSets.test
                }
            }
        }
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'registe_events'
            property 'forge.logging.console.level', 'debug'
            mods {
                "xiuxian" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'


}

apply from: 'pack/integration.gradle'

tasks.register('luoxiaVerify') {
    // Actual mod blocks require the Forge registry lifecycle, not vanilla Bootstrap.
    dependsOn 'runGameTestServer'
}

tasks.register('prepareLuoxiaGameTestFixture', Copy) {
    // The destination is also the persistent GameTest working directory;
    // Minecraft creates worlds, locks and logs there between runs.  Gradle's
    // output snapshotter cannot safely claim that directory as an exclusive
    // Copy output, so opt this fixture copy out of state tracking.
    doNotTrackState('GameTest fixture destination is a persistent Minecraft working directory')
    from('src/test/resources/gameteststructures') {
        into 'gameteststructures'
    }
    from 'src/test/resources/luoxia-server.properties'
    rename 'luoxia-server.properties', 'server.properties'
    into 'run/luoxia-gametest'
}

tasks.matching { it.name == 'prepareRunGameTestServer' }.configureEach {
    dependsOn tasks.named('prepareLuoxiaGameTestFixture')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
